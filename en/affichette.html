<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;600&family=Nunito:wght@600;700;800&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>body { margin: 0; background: #e9e4da; } a { color: #285e1f; } a:hover { color: #327426; } @page { size: 148mm 210mm; margin: 0; } @media print { [data-noprint] { display: none !important; } body { background: #f5ead8; } #wrap { padding: 0 !important; } }</style>
</helmet>
<div data-noprint="1" style="position: fixed; top: 16px; right: 16px; z-index: 10; display: flex; gap: 8px; align-items: center; padding: 8px 8px 8px 16px; background: #ffffff; border-radius: 999px; box-shadow: 0 6px 20px rgba(60,40,20,.18); font-family: 'Nunito', sans-serif;">
  <span style="font-size: 14px; font-weight: 700; color: #5b3b27;">Choose “Save as PDF”</span>
  <button type="button" onClick="{{ doPrint }}" style="border: 0; cursor: pointer; background: #3d8b2f; color: #ffffff; font: inherit; font-weight: 800; font-size: 15px; padding: 10px 18px; border-radius: 999px;">⬇️ Download as PDF</button>
</div>
<div id="wrap" style="display: flex; justify-content: center; padding: 40px;">
  <div data-screen-label="Affichette A5" style="position: relative; width: 148mm; height: 210mm; overflow: hidden; background: #f5ead8; font-family: 'Nunito', sans-serif; color: #4a2e1f; box-sizing: border-box; padding: 14mm 12mm 11mm; display: flex; flex-direction: column;">
    <div style="position: absolute; right: -38mm; top: -30mm; width: 100mm; height: 100mm; border-radius: 50%; background: #e9d4b4;"></div>
    <img loading="lazy" decoding="async" src="../images/potiron.webp" alt="" style="position: absolute; right: 6mm; top: 8mm; width: 38mm; height: 38mm; object-fit: contain; transform: rotate(-8deg);">
    <img loading="lazy" decoding="async" src="../images/pomme.webp" alt="" style="position: absolute; right: 36mm; top: 30mm; width: 20mm; height: 20mm; object-fit: contain; transform: rotate(10deg);">
    <img src="../images/logo.webp" alt="Sainos" style="position: relative; height: 13mm; width: auto; align-self: flex-start;">
    <span style="position: relative; margin-top: 2mm; font-size: 11pt; font-weight: 800; letter-spacing: 1.5pt; color: #5f6d47;">THE SPIRIT OF THE SEASONS</span>
    <h1 style="position: relative; margin: 14mm 0 0; font-family: 'DynaPuff', sans-serif; font-weight: 600; font-size: 31pt; line-height: 1.02; max-width: 105mm;">What’s in season to eat?</h1>
    <div style="position: relative; margin-top: 8mm; display: flex; flex-direction: column; gap: 3.5mm; font-size: 13pt; font-weight: 700; line-height: 1.3;">
      <div style="display: flex; gap: 3mm; align-items: center;"><span style="flex: none; width: 7mm; height: 7mm; border-radius: 50%; background: #3d8b2f; color: #ffffff; display: grid; place-items: center; font-size: 11pt;">1</span>The calendar of fruit, vegetables and herbs</div>
      <div style="display: flex; gap: 3mm; align-items: center;"><span style="flex: none; width: 7mm; height: 7mm; border-radius: 50%; background: #3d8b2f; color: #ffffff; display: grid; place-items: center; font-size: 11pt;">2</span>Markets near you</div>
      <div style="display: flex; gap: 3mm; align-items: center;"><span style="flex: none; width: 7mm; height: 7mm; border-radius: 50%; background: #3d8b2f; color: #ffffff; display: grid; place-items: center; font-size: 11pt;">3</span>Zero-waste tips and a kids mode</div>
    </div>
    <div style="position: relative; margin-top: auto; display: flex; gap: 7mm; align-items: center; background: #ffffff; border-radius: 8mm; padding: 6mm;">
      <img loading="lazy" decoding="async" src="{{ qr }}" alt="QR code to sainos.fr/en" style="flex: none; width: 42mm; height: 42mm; display: block;">
      <div style="display: flex; flex-direction: column; gap: 2mm;">
        <span style="font-family: 'DynaPuff', sans-serif; font-weight: 600; font-size: 17pt; line-height: 1.1;">Scan me!</span>
        <span style="font-size: 12pt; line-height: 1.35; font-weight: 600;">Free, no ads, no sign-up.</span>
        <span style="margin-top: 2mm; font-family: 'DynaPuff', sans-serif; font-size: 18pt; color: #3d8b2f;">sainos.fr/en</span>
      </div>
    </div>
    <span style="position: relative; margin-top: 5mm; font-size: 12pt; font-weight: 800; text-align: center;">@sainos_fr · Instagram · Facebook · TikTok</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;url&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://www.sainos.fr/?utm_source=affichette&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() { if (/[?&]pdf/.test(location.search)) { const go = () => setTimeout(() => window.print(), 600); if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go(); } }
  renderVals() {
    let qr = '';
    if (window.qrcode) {
      const q = window.qrcode(0, 'M'); q.addData(this.props.url ?? 'https://www.sainos.fr/en/?utm_source=affichette'); q.make();
      const svg = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true }).replace(/fill="black"/g, 'fill="#4a2e1f"').replace(/fill="white"/g, 'fill="#ffffff"');
      qr = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    } else setTimeout(() => this.forceUpdate(), 150);
    return { qr, doPrint: () => window.print() };
  }
}
</script>
